plugins {
	id 'net.fabricmc.fabric-loom'
}

base {
	archivesName = "Leafs-common-${minecraftMajor}"
}

dependencies {
	minecraft "com.mojang:minecraft:${rootProject.minecraft_version}"
	compileOnly "net.fabricmc:fabric-loader:${rootProject.loader_version}"
	compileOnly "fr.hardel:firefly-fabric-${minecraftMajor}:${rootProject.firefly_version}"
	testImplementation platform("org.junit:junit-bom:5.12.2")
	testImplementation "org.junit.jupiter:junit-jupiter"
	testRuntimeOnly "org.junit.platform:junit-platform-launcher"
}

test {
	useJUnitPlatform()
}

loom {
	accessWidenerPath = file('src/main/resources/leafs.accesswidener')
}
